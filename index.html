<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>جمعية درع</title>
        <style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
:root{
    --navy:#153e57;
    --teal:#319b9c;
    --green:#4db782;
    --bg:#f2f7f7}
    *{box-sizing:border-box}
    body{
        margin:0;
        background:var(--bg);
        font-family:Cairo,Tahoma,sans-serif;
        color:#173b4c
    }
    header{
        background:#092632;
        color:white;
        padding:14px max(20px,4vw);
        display:flex;
        align-items:center;
        gap:18px;
        box-shadow:0 3px 18px #09263230
    }
    header img{
        width:65px;
        height:65px;
        object-fit:contain;
        background:transparent;
        border-radius:0;
        flex-shrink:0
    }
    header h1{font-size:23px;margin:0}
    header p{
        margin:0;
        color:#a9cdd2;
        font-size:12px
    }
    .shell{
        max-width:1450px;
        margin:auto;
        padding:26px;
        display:grid;
        grid-template-columns:minmax(0,1fr);
        gap:22px
    }
    .panel,.preview-panel{
        background:white;
        border:1px solid #dce8e9;
        border-radius:20px;
        padding:24px;
        box-shadow:0 8px 30px #123b4810
    }
    .panel{
        max-width:980px;
        width:100%;
        margin:0 auto
    }
    .preview-panel{order:-1;width:100%}
    .panel h2,.preview-panel h2{
        font-size:19px;
        margin:0 0 18px
    }
    .label{
        display:block;
        font-weight:700;
        font-size:13px;
        margin:14px 0 6px
    }
    input,textarea,select{
        width:100%;
        font:inherit;
        border:1px solid #d3e1e4;
        border-radius:10px;
        padding:10px 12px;
        background:#fbfdfd;
        color:#153e57
    }
    textarea{min-height:90px;resize:vertical}
    .categories{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:8px
    }
    .cat{
        border:1px solid #d5e6e7;
        background:#f6faf9;
        padding:10px 5px;
        border-radius:11px;
        cursor:pointer;
        font:600 12px Cairo,Tahoma
    }
    .cat.active{
        background:#d9f2e9;
        border-color:#42ac8b;
        color:#096d57
    }
    .actions{
        display:flex;
        gap:10px;
        margin-top:20px;
        flex-wrap:wrap
    }
    button.primary,button.secondary{
        border:0;
        border-radius:10px;
        padding:12px 18px;
        cursor:pointer;
        font:700 13px Cairo,Tahoma
    }
    button.primary{
        background:#208a78;
        color:white;
        flex:1
    }
    button.secondary{
        background:#e9f1f4;
        color:#194a61
    }
    .preview-panel{text-align:center}
    .toolbar{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        flex-wrap:wrap;
        margin-bottom:16px
    }
    .toolbar h2{margin:0}
    .toolbar select{
        width:auto;
        min-width:190px
    }
    .stage{
        background:#e7eff0;
        border-radius:15px;
        padding:22px;
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:520px;
        overflow:hidden
    }
    canvas{
        max-width:100%;
        max-height:75vh;
        object-fit:contain;
        box-shadow:0 16px 45px #102e3e30;
        border-radius:3px;
        background:white
    }
    .bg-tools{
        margin-top:18px;
        padding:15px;
        border:1px solid #d7e8e5;
        background:#f5faf9;
        border-radius:14px
    }
    .bg-tools h3{margin:0 0 8px;font-size:15px}
    .bg-tools input[type=range]
    {padding:0;accent-color:#218f82}
    .range-line{
        display:flex;
        justify-content:space-between;
        font-size:12px;
        color:#54727a
    }
    .bg-tools .inline{
        display:flex;
        gap:8px;
        align-items:center
    }
    .bg-tools .inline button{
        white-space:nowrap;
        border:0;
        background:#e3eeee;
        border-radius:9px;
        padding:10px;
        cursor:pointer
    }
    .hint{
        color:#6d8590;
        font-size:12px;
        margin:14px 0 0
    }
    .foot{
        text-align:center;
        padding:20px;
        color:#68808b;
        font-size:12px
    }
    @media(max-width:900px){
        .shell{grid-template-columns:1fr;padding:14px}
        .stage{min-height:380px;padding:10px}
        header h1{font-size:18px}
        .panel,.preview-panel{padding:16px}
    }

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{min-width:0;overflow-x:hidden}
header{min-width:0;flex-wrap:wrap}
header>div{min-width:0;flex:1}
header h1,header p{overflow-wrap:anywhere}
.shell,.panel,.preview-panel,.toolbar,.stage{min-width:0}
.panel,.preview-panel{max-width:100%}
input,textarea,select,button{max-width:100%;min-width:0}
input,textarea,select{font-size:16px}
.stage{min-height:0;max-width:100%;overflow:hidden}
.stage canvas{display:block;width:auto;height:auto;max-width:100%;max-height:min(68dvh,760px);object-fit:contain}
.categories{grid-template-columns:repeat(2,minmax(0,1fr))}
.cat{min-width:0;overflow-wrap:anywhere;min-height:45px}
.toolbar select{max-width:100%}
@media(min-width:1100px){.shell{max-width:1100px}.stage{padding:24px}.stage canvas{max-height:680px}}
@media(min-width:600px) and (max-width:1099px){.shell{padding:20px;gap:18px}.panel,.preview-panel{padding:22px}.stage canvas{max-height:65dvh}}
@media(max-width:599px){
 header{padding:12px 14px;gap:10px;align-items:center}
 header img{width:48px;height:48px}
 header h1{font-size:clamp(15px,4.5vw,19px);line-height:1.45}
 header p{font-size:11px;line-height:1.6}
 .shell{padding:10px;gap:12px}
 .panel,.preview-panel{padding:13px;border-radius:14px}
 .panel h2,.preview-panel h2{font-size:16px;margin-bottom:12px}
 .toolbar{align-items:stretch;flex-direction:column;gap:8px}
 .toolbar select{width:100%;min-width:0}
 .stage{padding:10px 6px;border-radius:10px}
 .stage canvas{max-height:56dvh;max-width:100%;box-shadow:0 6px 22px #102e3e25}
 .categories{gap:6px}
 .cat{font-size:11px;padding:9px 5px}
 .bg-tools{padding:11px}
 .actions{flex-direction:column}
 .actions button{width:100%;flex:auto}
 .foot{padding:15px 12px}
}
@media(max-width:360px)
{
    header img{width:42px;height:42px}
    .stage canvas{max-height:50dvh}
    .cat{font-size:10px}}
@media(orientation:landscape) and (max-height:520px){.stage canvas{max-height:70dvh}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

</h1>
        </div>
    </header>
    <main class="shell">
        <section class="panel">
            <h2>إعداد بيانات البطاقة</h2>
            <span class="label">نوع المناسبة</span>
            <div class="categories" id="categories">
                
            </div>
            <label class="label" for="title">عنوان البطاقة</label>
            <input id="title" value="">
            <label class="label" for="person">اسم الشخص أو الجهة</label>
            <input id="person" value="">
            <label class="label" for="role">الصفة أو المسمى</label>
            <input id="role" placeholder="الصفة الوظيفية (اختياري)">
            <label class="label" for="message">نص البطاقة</label>
            <textarea id="message" placeholder="اكتب النص الذي تريده (اختياري)"></textarea>
            <label class="label" for="sender">الجهة المقدمة</label>
            <input id="sender" value="">
            <label class="label" for="date">التاريخ</label>
            <input id="date" placeholder="اختياري">
            <label class="label" for="accent">نظام الألوان المعتمد</label>
            <select id="accent"><option value="green">الهوية الخضراء المعتمدة</option>
                <option value="blue">الهوية الزرقاء الرسمية</option>
                <option value="teal">الهوية التركوازية</option>
                <option value="dark">الهوية الرسمية الداكنة</option>
            </select>
            <div class="bg-tools">
                <h3>إعدادات الخلفية البصرية</h3>
                <label class="label" for="bgStyle">اختيار النمط البصري للخلفية</label>
                <select id="bgStyle">
                    <option value="mountain">الطابع الطبيعي</option>
                    <option value="geometry">النمط الهندسي المؤسسي</option>
                    <option value="waves">النمط الانسيابي المؤسسي</option>
                    <option value="plain">الخلفية الرسمية الموحدة</option>
                </select>
                <label class="label" for="bgUpload">أو أضف صورة من جهازك</label>
                <input id="bgUpload" type="file" accept="image/*">
                <div class="inline" style="margin-top:9px">
                    <button type="button" id="removeBg">إزالة الصورة</button>
                    <span style="font-size:11px;color:#637f83">
                        
                    </span>
                </div>
                <label class="label" for="bgOpacity">درجة ظهور صورة الخلفية</label>
                <input type="range" id="bgOpacity" min="0" max="100" value="35">
                <div class="range-line">
                    <span>خفيفة</span>
                    <output id="bgOpacityValue">35%</output>
                    <span>واضحة</span>
                </div>
                <label class="label" for="bgBrightness">سطوع الخلفية</label>
                <input type="range" id="bgBrightness" min="30" max="170" value="100"><div class="range-line">
                    <span>داكنة</span>
                    <output id="bgBrightnessValue">100%</output>
                    <span>فاتح</span>
                </div>
                <label class="label" for="bgShade">مستوى شفافية الطبقة البيضاء</label>
                <input type="range" id="bgShade" min="0" max="95" value="24">
                <div class="range-line">
                    <span>بدون تخفيف</span>
                    <output id="bgShadeValue">24%</output>
                    <span>خفيفة جدًا</span>
                </div>
            </div>
            <div class="actions">
                <button class="primary" id="download">تنزيل البطاقة PNG</button>
                <button class="secondary" id="reset">إعادة تعيين</button>
            </div>
        </section>
        <section class="preview-panel">
            <div class="toolbar">
                <h2>المعاينة المباشرة</h2>
                <select id="size">
                    <option value="1080x1350">منشور رأسي — 1080 × 1350</option>
                    <option value="1080x1080">منشور مربع — 1080 × 1080</option>
                    <option value="1080x1920">قصة رقمية — 1080 × 1920</option>
                </select>
            </div>
            <div class="stage">
                <canvas id="card" width="1080" height="1350" aria-label="معاينة البطاقة">
                    
                </canvas>
            </div>
            <p class="hint">
                
            </p>
        </section>
    </main>
    <div class="foot">© جمعية درع للبحث والإنقاذ والإغاثة بمنطقة تبوك </div>
    <script>
const templates=[
'الشكر والتقدير'
,'التهنئة والتبريكات'
,'تعزية ومواساة'
,'التكريم والإنجازات'
,'المناسبات الوطنية'
,'الأعياد والمناسبات الدينية'
,'الترحيب بالأعضاء والمتطوعين'
,'فعاليات الجمعية الرسمية']
.map(x=>[x,'','']);
let selected=0;
const ids=[
'title',
'person',
'role',
'message',
'sender',
'date',
'accent',
'size'];
const el=id=>document.getElementById(id);
const cats=el('categories');
templates.forEach((t,i)=>{const b=document.createElement('button');
b.className='cat'+(i===0?' active':'');
b.textContent=t[0];
b.onclick=()=>{selected=i;
    document.querySelectorAll('.cat').forEach((x,j)=>x.classList.toggle('active',j===i));
    el('title').value=t[1];
    el('message').value=t[2];
    draw()};
    cats.appendChild(b)});
    let userBg=null;
    const bgUpload=el('bgUpload');
    bgUpload.addEventListener('change',()=>{const file=bgUpload.files&&bgUpload.files[0];
        if(!file)return;
        if(!file.type.startsWith('image/'))
        {alert('اختر ملف صورة صالحًا');
        return}const url=URL.createObjectURL(file),img=new Image();
        img.onload=()=>{userBg=img;URL.revokeObjectURL(url);draw()};
        img.onerror=()=>{URL.revokeObjectURL(url);alert('تعذر قراءة الصورة')};img.src=url});
        el('removeBg').onclick=()=>{userBg=null;
            bgUpload.value='';
